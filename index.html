<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Najah">
<meta name="description" content="نجاح: خطة دراسية، دروس، مؤقت تركيز وواحة لتلاميذ البكالوريا في الجزائر.">
<title>Najah — BAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2EF;--surface:#FFFFFF;--ink:#14211C;--muted:#5A6A63;--line:#D6DFDA;
  --green:#0B5D45;--green-ink:#FFFFFF;--green-soft:#DDEDE6;
  --red:#C4122F;--red-soft:#FBE3E7;--gold:#9A6F00;--gold-soft:#F6ECCF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1613;--surface:#16211D;--ink:#E7EEEA;--muted:#9AABA3;--line:#27352F;
  --green:#3DBA8C;--green-ink:#06231A;--green-soft:#163128;
  --red:#FF5C72;--red-soft:#3A1920;--gold:#E6BA4C;--gold-soft:#2E2715;}}
:root[data-theme="dark"]{
  --bg:#0E1613;--surface:#16211D;--ink:#E7EEEA;--muted:#9AABA3;--line:#27352F;
  --green:#3DBA8C;--green-ink:#06231A;--green-soft:#163128;
  --red:#FF5C72;--red-soft:#3A1920;--gold:#E6BA4C;--gold-soft:#2E2715;}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;min-height:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
#app{max-width:480px;margin:0 auto;padding:18px 18px 120px}
h1{font-size:28px;line-height:1.2;font-weight:700}
h2{font-size:21px;line-height:1.3;font-weight:700}
h3{font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:22px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:0;background:var(--green);color:var(--green-ink);font-weight:600;cursor:pointer;padding:0 16px;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{min-height:40px;width:auto;font-size:14px;padding:0 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:4px 0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;min-height:40px}
.back{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:20px;line-height:1}
[dir="rtl"] .back{transform:scaleX(-1)}
.lang{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--green-soft);color:var(--green)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.plain{background:var(--bg);color:var(--muted)}
.opt{display:block;width:100%;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.opt.on{border-color:var(--green);background:var(--green-soft)}
.opt b{display:block;font-size:17px}
.opt span{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.in{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
textarea.in{min-height:96px;resize:vertical}
.in:focus{outline:none;border-color:var(--green)}
/* the countdown: the one loud element */
.count{border:2px solid var(--ink);border-radius:18px;padding:18px 18px 14px;background:var(--surface);position:relative}
.count .num{font-size:76px;font-weight:700;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.count .lbl{font-size:17px;font-weight:600;margin-top:6px}
.count .date{font-size:13px;color:var(--muted);margin-top:2px}
.count::after{content:"";position:absolute;inset-inline-end:18px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--red)}
.steps{counter-reset:s;list-style:none}
.steps>li{counter-increment:s;position:relative;padding-inline-start:44px;padding-bottom:20px;border-inline-start:2px solid var(--line);margin-inline-start:15px}
.steps>li:last-child{border-color:transparent;padding-bottom:0}
.steps>li::before{content:counter(s);position:absolute;inset-inline-start:-16px;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--green);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:14px}
.lesson{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lesson:last-child{border:0}
.play{flex:none;width:42px;height:42px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:16px}
.lock{background:var(--gold-soft);border:1px solid var(--gold);border-radius:16px;padding:16px}
.msg{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.msg.me{background:var(--green);color:var(--green-ink);margin-inline-start:auto;border-end-end-radius:4px}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-end-start-radius:4px}
.chat{display:flex;flex-direction:column;gap:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{max-width:480px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;padding:9px 2px 10px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.nav button.on{color:var(--green);font-weight:700}
.nav svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start;cursor:pointer}
.tile b{display:block;font-size:15px}
.tile span{font-size:13px;color:var(--muted)}
.qopt{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.qopt.on{border-color:var(--green);background:var(--green-soft)}
.qopt.good{border-color:var(--green);background:var(--green-soft)}
.qopt.bad{border-color:var(--red);background:var(--red-soft)}
.wordmark{font-size:64px;font-weight:700;line-height:1;letter-spacing:-1px}
.ltr{direction:ltr;unicode-bidi:isolate}
hr{border:0;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}

/* ---------- motion ---------- */
.btn,.opt,.tile,.qopt,.lang,.back{transition:transform .15s ease,background-color .2s,border-color .2s}
.btn:active,.tile:active,.back:active,.lang:active{transform:scale(.96)}
.opt:active,.qopt:active{transform:scale(.985)}
@media (prefers-reduced-motion:no-preference){
 .count::after{animation:beat 1.6s ease-in-out infinite}
 @keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.55}}
 .intro .btn::after{animation:shine 2.8s 1.8s infinite}
}
@keyframes shine{to{transform:translateX(100%)}}
.cf{position:fixed;z-index:30;border-radius:2px;pointer-events:none}
/* ---------- plan, progress, focus ---------- */
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.tick{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--green-ink);font-weight:700;cursor:pointer;display:grid;place-items:center;transition:background-color .2s,border-color .2s,transform .15s}
.tick:active{transform:scale(.88)}
.task.on .tick{background:var(--green);border-color:var(--green)}
.task.on b{text-decoration:line-through;color:var(--muted)}
.tbody{flex:1;text-align:start;background:none;border:0;cursor:pointer;color:inherit;text-decoration:none;display:block;padding:0}
.tbody b{display:block;font-size:15px}
.tbody span{font-size:13px;color:var(--muted)}
.week{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.week:last-child{border:0}
.week .wk{flex:none;width:52px;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.chart i{display:block;width:100%;max-width:30px;background:var(--green);border-radius:7px 7px 2px 2px;min-height:3px}
.chart div.today i{background:var(--gold)}
.chart span{font-size:11px;color:var(--muted)}
.chart em{font-style:normal;font-size:11px;font-weight:600}
.stat{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600}
.badge i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 6px;border-radius:50%;font-style:normal;font-size:20px;background:var(--gold-soft);color:var(--gold)}
.badge.off{opacity:.4;filter:grayscale(1)}
.ringwrap{position:relative;width:min(260px,72vw);margin:0 auto}
.ring{width:100%;display:block;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--line);stroke-width:12}
.ring .arc{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.teacher{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.teacher:last-child{border:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700}
.tips{padding-inline-start:18px;display:grid;gap:6px;font-size:14px}
/* ---------- premium home, nav, garden, theme ---------- */
:root{--glass:rgba(255,255,255,.78)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(22,33,29,.78)}}
:root[data-theme="dark"]{--glass:rgba(22,33,29,.78)}
body{transition:background-color .35s,color .35s}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;min-height:220px;color:#fff;
 background:linear-gradient(155deg,#0B5D45 0%,#128462 55%,#2C9C74 100%);box-shadow:0 18px 40px -22px rgba(11,93,69,.9)}
.hero.night{background:linear-gradient(155deg,#071A2C 0%,#0C2F3A 55%,#124A3B 100%);box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
.hero-art{position:absolute;inset-inline-end:-6px;bottom:0;width:70%;max-width:320px}
[dir="rtl"] .hero-art{transform:scaleX(-1)}
.hero-in{position:relative}
.hero .num{font-size:88px;font-weight:700;line-height:1;letter-spacing:-3px;margin-top:10px;font-variant-numeric:tabular-nums;text-shadow:0 6px 24px rgba(0,0,0,.18)}
.hero .lbl{font-size:17px;font-weight:600;opacity:.95}
.pillchip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.mring{width:52px;height:52px}
.glow{position:relative;border:0;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--green),#F2B544,var(--green)) border-box;border:1.5px solid transparent}
.qa{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.qa::-webkit-scrollbar{display:none}
.qa button{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;background:none;border:0;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.blob{display:grid;place-items:center;width:52px;height:52px;border-radius:18px;font-size:22px;font-weight:700;color:var(--tint);background:color-mix(in srgb,var(--tint) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--tint) 30%,transparent);transition:transform .2s}
.qa button:active .blob{transform:scale(.9) rotate(-6deg)}
.tip{display:flex;gap:12px;align-items:center}
.tip .blob{width:40px;height:40px;border-radius:14px;font-size:17px;flex:none}
.garden{border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.garden-svg{display:block;width:100%;height:auto}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lg{display:flex;gap:8px;align-items:center}
.lg b{font-size:14px}
.nav{background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px)}
.nav div{position:relative}
.nav .pill{position:absolute;top:5px;bottom:5px;inset-inline-start:0;width:20%;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.nav .pill::before{content:"";position:absolute;inset:0 8px;border-radius:14px;background:var(--green-soft)}
.nav button{position:relative;z-index:1}
.av{border:0;cursor:pointer}
.tile:hover,.opt:hover{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
@media (prefers-reduced-motion:no-preference){
 .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
 @keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
 .cloud{animation:drift 26s linear infinite alternate}.cloud.slow{animation-duration:38s}
 @keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
 .twinkle{animation:twinkle 2.6s ease-in-out infinite}
 @keyframes twinkle{50%{opacity:.25}}
 .sunglow{transform-box:fill-box;transform-origin:center;animation:glow 3.5s ease-in-out infinite}
 @keyframes glow{50%{transform:scale(1.18);opacity:.2}}
 .grow{transform-box:fill-box;transform-origin:50% 100%}
 .hero::after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.14),transparent 45%);animation:sheen 9s ease-in-out infinite alternate;pointer-events:none}
 @keyframes sheen{to{transform:translate(18%,12%)}}
}
.grow{transform-box:fill-box;transform-origin:50% 100%}
/* ---------- season grid, profile, badges ---------- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px}
.wcell{display:grid;place-items:center;aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;font-style:normal;min-width:18px}
.wlegend .wcell{width:16px;height:16px;display:inline-grid;vertical-align:middle;margin-inline-end:4px;font-size:9px;cursor:default}
.wcell.ok{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.wcell.miss{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.wcell.now{border:2.5px solid var(--gold);color:var(--ink);background:var(--gold-soft)}
.wcell.learn,.wcell.warm,.wcell.recover,.wcell.holiday{background:color-mix(in srgb,var(--green) calc(var(--f,1)*38%),var(--surface));color:var(--ink)}
.wcell.recover,.wcell.holiday{border-style:dashed}
.wcell.rev,.wcell.taper{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.wcell.bac{background:var(--red);border-color:var(--red);color:#fff}
.wlegend{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted)}
.profile{display:flex;flex-direction:column;gap:14px;background:linear-gradient(160deg,var(--green-soft),var(--surface) 70%)}
.av.big{width:58px;height:58px;font-size:24px}
.pins{display:flex;flex-wrap:wrap;gap:8px}
.pinb{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:13px;border:1px solid var(--gold)}
.pinb i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font-size:22px}.grid3 span{font-size:12px;color:var(--muted)}
button.badge{cursor:pointer;font:inherit;font-size:12px;font-weight:600;color:var(--ink)}
.badge .bdesc{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:3px}
.badge.pinned{border:2px solid var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
/* ---------- plans, checkout, ads ---------- */
.cmp{padding:6px 14px}
.cmp-row{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmp-row:last-child{border:0}.cmp-row.head b{text-align:center}
.cmp-row i{font-style:normal;text-align:center;font-weight:700}.cmp-row i.y{color:var(--green)}.cmp-row i.n{color:var(--muted)}
.gold-t{color:var(--gold)}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.copyrow b{display:block;font-size:15px;word-break:break-all}
.adwarn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);white-space:nowrap}
.adwarn button{background:var(--gold);color:#fff;border:0;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer}
.adsheet{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.adcard{width:100%;max-width:440px;background:var(--surface);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.adlabel{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.adclose{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;color:var(--ink)}
.adclose:disabled{opacity:.6;cursor:default}
.adbox{border:1px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
/* ---------- intro ---------- */
.intro{position:fixed;inset:0;overflow:hidden;z-index:20;display:flex;flex-direction:column;
 padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));
 background:radial-gradient(120% 80% at 85% 5%,#16825F 0%,#0B5D45 42%,#05291F 100%);color:#F2FFF9}
.intro .lang{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
.floaters{position:absolute;inset:0;pointer-events:none}
.floaters span{position:absolute;font-weight:600;color:rgba(255,255,255,.13);white-space:nowrap;direction:ltr}
.intro-top{position:relative;display:flex;justify-content:flex-end;max-width:480px;width:100%;margin:0 auto}
.intro-body{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;max-width:480px;width:100%;margin:0 auto}
.logo{font-size:104px;font-weight:700;line-height:1.05;letter-spacing:-1px}
.swash{display:block;width:190px;height:20px;margin-top:6px}
[dir="ltr"] .swash{transform:scaleX(-1)}
.swash path{stroke:#E6BA4C;stroke-width:5;fill:none;stroke-linecap:round}
.intro .tag{font-size:19px;margin-top:18px;max-width:28ch;opacity:.92}
.rot{height:52px;margin-top:30px;position:relative}
.rot div{position:absolute;inset:0;display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px}
.rot i{font-style:normal;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:18px}
.dots{display:flex;gap:6px;margin-top:12px}
.dots b{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.35);transition:width .35s,background .35s}
.dots b.on{width:22px;background:#E6BA4C}
.intro-foot{position:relative;max-width:480px;width:100%;margin:0 auto}
.intro .btn{background:#fff;color:#0B5D45;position:relative;overflow:hidden;min-height:56px;font-size:17px}
.intro .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(11,93,69,.2) 50%,transparent 70%);transform:translateX(-100%)}
.intro .note{text-align:center;font-size:13px;opacity:.7;margin-top:12px}

  else{f=trend;if(w===0){t="warm";f=Math.min(trend,.55)}else if(w===1){t="warm";f=Math.min(trend,.62)}else if(w%4===3){t="recover";f=trend*.75}
   if(!lib&&inHol(s)){t="holiday";f=trend*.6}}
  weeks.push({s,t,f,k:[]})}
 const L_=weeks.map((x,i)=>i).filter(i=>["learn","warm","recover","holiday"].includes(weeks[i].t));
 const cap=i=>cfg.hours*cfg.days*weeks[i].f*ef,totalCap=L_.reduce((a,i)=>a+cap(i),0);

  Q._f=top.filter(s=>!S.done["f:"+s]).map(s=>({k:"f:"+s,f:-1,h:2,ew:0,c:9}))}
 for(const s in b.s){const ch=CH[s]||[],at=lib?null:S.classAt[s],c=b.s[s];Q[s]=[];ch.forEach((x,i)=>{const k=s+":"+i;if(S.done[k])return;
  const late=at!=null&&i<at,now=at!=null&&i===at;let f=(i+.5)/ch.length;if(lib&&cfg.order==="impact")f*=8/(c+2);if(s===S.hardest)f*=.85;
  Q[s].push({k,f:late?-.5+f*.1:f,h:hoursFor(s,cfg.level),c,ew:(lib||late||now||cfg.level==="ahead"||at!=null)?0:triW(x[2]||1)})})}
 let need=0;const all=Object.values(Q).flat();all.forEach(t=>need+=t.h);let trimmed=false;
 if(need>totalCap){all.forEach(t=>{if(t.c<=2)t.h=1});trimmed=true;need=all.reduce((a,t)=>a+t.h,0)}
 if(need>totalCap){all.forEach(t=>{if(t.c<=3)t.h=Math.min(t.h,1.5)});need=all.reduce((a,t)=>a+t.h,0)}
 let placed=0;const total=all.length;
 /* pace evenly: spread each term's lessons over that term's weeks (with a 15% buffer) instead of front-loading */
 const bounds=[...new Set(all.map(t=>t.ew))].sort((a,b)=>a-b),ratio={};
 bounds.forEach((a,j)=>{const b=j+1<bounds.length?bounds[j+1]:Infinity,ws=L_.filter(w=>w>=a&&w<b);
  const nd=all.filter(t=>t.ew>=a&&t.ew<b).reduce((x,t)=>x+t.h,0),cp=ws.reduce((x,w)=>x+cap(w),0);ws.forEach(w=>ratio[w]=cp?Math.min(1,nd*1.15/cp):1)});

function gardenSVG(list,o={}){const dk=isDark(),mini=!!o.mini,id=mini?"m":"g",W=360,top=mini?72:112,cols=mini?6:5;
 const rows=Math.max(1,Math.ceil(list.length/cols)),H=mini?160:Math.max(290,top+64+rows*32);

  return{t,i:o.offset?o.offset+i:i,x,y:top+30+row*(mini?20:32),sc:(mini?.55:.72+Math.min(row,8)*.035)*sizeOf(t)}}).sort((a,b)=>a.y-b.y);

 ${!list.length?`<text x="${W/2}" y="${top+(H-top)/2+6}" text-anchor="middle" font-size="14" font-weight="600" fill="${dk?"#E7EEEA":"#5A4A2A"}">${L("واحتك تنتظر أول شجرة","Your oasis is waiting for its first tree")}</text>`:""}</svg>`}

/* ----- focus timer ----- */
const CIRC=2*Math.PI*108;
function ftLeft(){const f=S.ft;return f?(f.end?Math.max(0,f.end-Date.now()):f.left):(V.dur||25)*60000}
const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
SC.focus=()=>{const f=S.ft,b=branch(),total=(f?f.dur:(V.dur||25))*60000,left=ftLeft();
 return `${hdr(L("مؤقّت التركيز","Focus timer"))}
 <div class="stack-lg">
  <div class="ringwrap"><svg class="ring" viewBox="0 0 240 240" aria-hidden="true"><circle class="trk" cx="120" cy="120" r="108"/><circle class="arc" id="ftArc" cx="120" cy="120" r="108" style="stroke-dasharray:${CIRC};stroke-dashoffset:${CIRC*(1-left/total)}"/></svg>
   <div class="ringtxt"><b id="ftTime">${mmss(left)}</b><span class="small muted">${f?N(SUB[f.sub]):L("اختر المدة والمادة","Pick a length and subject")}</span></div></div>
  ${!f?`<div class="seg">${[25,45,60].map(m=>`<button class="${(V.dur||25)===m?"on":""}" data-a="ftDur" data-m="${m}">${m} ${L("د","min")}</button>`).join("")}</div>
   <div><label class="f" for="ftSub">${L("المادة","Subject")}</label><select class="in" id="ftSub">${Object.keys(b.s).map(s=>`<option value="${s}" ${s===S.hardest?"selected":""}>${N(SUB[s])}</option>`).join("")}</select></div>
   <button class="btn" data-a="ftStart">${L("ابدأ الجلسة","Start session")}</button>`
  :`<div class="row">${f.end?`<button class="btn ghost" data-a="ftPause">${L("إيقاف مؤقت","Pause")}</button>`:`<button class="btn" data-a="ftResume">${L("استئناف","Resume")}</button>`}<button class="btn ghost" data-a="ftStop">${L("إنهاء","End")}</button></div>`}
  <div class="card small"><b>${L("نصيحة","Tip")}:</b> ${L("ضع هاتفك على وضع الطيران، ادرس حتى يرن المؤقت، ثم خذ استراحة 5 دقائق.","Put your phone on airplane mode, study until the timer ends, then take a 5-minute break.")}
   <div class="muted" style="margin-top:6px">${L("اليوم","Today")}: ${S.log[today()]||0} ${L("دقيقة","min")}</div></div>
 </div>`};
function ftFinish(){const f=S.ft;S.ft=null;if(new Date().getHours()<8)S.flags.early=1;addMin(f.dur);plant(f.dur>=60?"cedar":f.dur>=45?"orange":"olive",f.dur,null,f.sub);confetti(innerWidth/2,innerHeight/3);
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}if(["focus","home","progress"].includes(V.s))render()}
setInterval(()=>{const f=S.ft;if(!f)return;if(f.end&&Date.now()>=f.end)return ftFinish();
 const t=$("#ftTime"),a=$("#ftArc"),c=$("#ftchip"),left=ftLeft();if(t)t.textContent=mmss(left);if(a)a.style.strokeDashoffset=CIRC*(1-left/(f.dur*60000));if(c)c.textContent=mmss(left)},1000);

 role(d){S.role=d.r;save();go(d.r==="student"?(S.mode?"studentAuth":"mode"):"tSignup")},

  if(!n||!e||p.length<6)return toast(L("أدخل الاسم والبريد وكلمة مرور من 6 أحرف على الأقل.","Enter a name, email and a password of 6+ characters."));
  if(LIVE()){(async()=>{try{const c=await sbc();const {data,error}=await c.auth.signUp({email:e,password:p,options:{data:{name:n}}});if(error)throw error;if(!data.session)toast(L("تحقق من بريدك لتأكيد الحساب ثم سجّل الدخول.","Check your email to confirm, then log in."))}catch(err){toast(err.message)}})()}
  S.user={name:n,email:e};S.guest=false;save();toast(L("تم إنشاء حسابك","Account created"));stack=[];go(!S.mode?"mode":S.branch?(S.hardest?"home":"hardest"):"branch",{},false)},
 guest(){S.guest=true;save();stack=[];go(S.mode?"branch":"mode",{},false)},
 pickBranch(d){const changed=S.branch&&S.branch!==d.b;S.branch=d.b;loadCur();if(changed||!branch().s[S.hardest])S.hardest=null;save();go("hardest")},
 pickHard(d){S.hardest=d.sub;save();touch();stack=[];go("home",{},false)},
 done(d,el){const r=el.getBoundingClientRect();S.done[d.k]=!S.done[d.k];if(S.done[d.k]){S.doneAt[d.k]=today();plant("palm",0,d.k,d.k.split(":")[0])}else{delete S.doneAt[d.k];unplant(d.k)}touch();save();render();if(S.done[d.k]){(()=>{})(L("أحسنت! تم تسجيل تقدّمك.","Nice work! Progress saved."));confetti(r.left+r.width/2,r.top+r.height/2);const nc=document.querySelector(".card.pop");if(nc&&!RM)nc.animate([{opacity:0,transform:"translateY(24px) scale(.96)"},{opacity:1,transform:"none"}],{duration:520,delay:250,easing:"cubic-bezier(.3,1.4,.5,1)",fill:"backwards"})}},
 ask(d){const t=$("#askq").value.trim();if(!t)return toast(L("اكتب سؤالك أولاً.","Write your question first."));
  S.questions.push({id:Date.now(),key:d.k,sub:d.sub,ch:CH[d.sub][+d.k.split(":")[1]][0],text:t,by:S.user.email,name:S.user.name,reply:null});save();toast(L("أُرسل سؤالك إلى أساتذة المادة.","Question sent to this subject's teachers."));render()},
 qpick(d){V.ans=Object.assign({},V.ans,{[d.k]:+d.j});render()},
 qsubmit(){if(Object.keys(V.ans||{}).length<QZ[V.sub].length)return toast(L("أجب عن كل الأسئلة.","Answer every question."));V.submitted=true;touch();{const q0=QZ[V.sub],sc0=Math.round(q0.filter((q,k)=>V.ans[k]===q.a).length/q0.length*20);S.quizzes.push({sub:V.sub,score:sc0,date:today()});S.quizzes=S.quizzes.slice(-40);save()}render();window.scrollTo(0,0);quizFx();const sc=Math.round(QZ[V.sub].filter((q,k)=>V.ans[k]===q.a).length/QZ[V.sub].length*20);if(sc>=14)setTimeout(()=>confetti(innerWidth/2,160),500)},
 qreset(){V.ans={};V.submitted=false;render();window.scrollTo(0,0)},
 paper(){toast(L("تُضاف ملفات المواضيع من الأرشيف الرسمي قبل الإطلاق.","Paper PDFs are added from the official archive before launch."))},
 payM(d){V.m=d.m;render()},
 copy(d){try{navigator.clipboard.writeText(d.v);toast(L("نُسخ","Copied"))}catch(e){toast(d.v)}},
 async payChargily(){if(!LIVE())return(toast(L("تجريبي: محاكاة الدفع…","Demo: simulating payment…")),setTimeout(()=>activateDemo(30,"chargily"),1500));
  try{toast(L("جارٍ التحويل إلى صفحة الدفع…","Opening the payment page…"));const r=await fnCall("chargily-checkout",{return_url:location.origin+location.pathname});location.href=r.checkout_url}catch(e){toast(e.message)}},
 async payManual(){const ref=($("#txref").value||"").trim(),f=$("#txfile").files[0];
  if(!/^[A-Za-z0-9-]{6,40}$/.test(ref))return toast(L("أدخل رقم العملية كما هو في الوصل.","Enter the transaction number exactly as on the receipt."));
  if(!f)return toast(L("أرفق صورة الوصل.","Attach the receipt."));if(f.size>8e6)return toast(L("الملف كبير جداً (8 ميغا كحد أقصى).","File too large (8 MB max)."));
  if(!LIVE()){if(S.pays.some(p=>p.reference===ref))return toast(L("رقم العملية هذا استُعمل من قبل.","This transaction number was already used."));
   S.pays.push({id:"p"+Date.now(),provider:"baridimob",reference:ref,receipt:f.name,created_at:today(),status:"pending",email:S.user.email,name:S.user.name});return activateDemo(2,"baridimob","grace")}
  try{toast(L("جارٍ الإرسال…","Sending…"));const c=await sbc();const {data:{user}}=await c.auth.getUser();const path=`${user.id}/${Date.now()}.${(f.name.split(".").pop()||"jpg").toLowerCase()}`;
   const up=await c.storage.from("receipts").upload(path,f,{contentType:f.type});if(up.error)throw up.error;
   await fnCall("manual-payment",{method:"baridimob",reference:ref,receipt_path:path,note_code:payRef()});await refreshSub();V.m=null;tab("home")}catch(e){toast(e.message)}},
 payDemo(d){toast(L("تجريبي: محاكاة الدفع…","Demo: simulating payment…"));setTimeout(()=>activateDemo(30,d.m),1500)},
 async payPlay(){try{if(!("getDigitalGoodsService" in window))throw new Error(L("Google Play Billing غير متاح هنا.","Google Play Billing isn't available here."));
  const svc=await window.getDigitalGoodsService("https://play.google.com/billing");await svc.getDetails([CFG.playSku]);
  const req=new PaymentRequest([{supportedMethods:"https://play.google.com/billing",data:{sku:CFG.playSku}}],{total:{label:"Najah Plus",amount:{currency:"DZD",value:String(CFG.price)}}});
  const res=await req.show();await fnCall("play-verify",{purchaseToken:res.details.purchaseToken,sku:CFG.playSku});await res.complete("success");await refreshSub()}catch(e){toast(e.message||String(e))}},
 async adminLoad(){if(!LIVE()){V.list=S.pays.filter(p=>p.status==="pending");V.loading=0;return render()}
  try{const r=await fnCall("admin-review",{action:"list"});V.list=r.payments||[]}catch(e){toast(e.message);V.list=[]}V.loading=0;render()},
 async adminAct(d){if(!LIVE()){const p=S.pays.find(x=>x.id===d.id);p.status=d.v==="approve"?"approved":"rejected";
   if(p.email===(S.user&&S.user.email)){S.sub=d.v==="approve"?{status:"active",until:addD(today(),30),method:p.provider}:{status:"expired",until:today(),method:p.provider}}save();toast(d.v==="approve"?L("قُبل: +30 يوماً","Approved: +30 days"):L("رُفض","Rejected"));return A.adminLoad()}
  try{await fnCall("admin-review",{action:d.v,id:d.id});toast(d.v==="approve"?L("قُبل وفُعّل الاشتراك","Approved and activated"):L("رُفض","Rejected"));A.adminLoad()}catch(e){toast(e.message)}},
 async login(){const e=$("#em").value.trim(),p=$("#pw").value;if(!e||!p)return toast(L("أدخل البريد وكلمة المرور.","Enter email and password."));
  if(!LIVE()){S.user={name:$("#nm").value.trim()||e.split("@")[0],email:e};S.guest=false;save();stack=[];return go(!S.mode?"mode":S.branch?(S.hardest?"home":"hardest"):"branch",{},false)}
  try{const c=await sbc();const {data,error}=await c.auth.signInWithPassword({email:e,password:p});if(error)throw error;
   S.user={name:(data.user.user_metadata||{}).name||e.split("@")[0],email:e};S.guest=false;save();await refreshSub();stack=[];go(!S.mode?"mode":S.branch?(S.hardest?"home":"hardest"):"branch",{},false)}catch(err){toast(err.message)}},
 reset(){if(!confirm(L("سيتم مسح كل بياناتك على هذا الجهاز.","This clears all your data on this device.")))return;try{sb&&sb.auth.signOut()}catch(e){}localStorage.removeItem("najah");location.reload()},
 aiClear(){S.chat=[];save();render()},
 async aiSend(){const box=$("#aiq"),q=box.value.trim();if(!q)return;box.value="";
  S.chat.push({role:"user",content:q});S.chat.push({role:"assistant",content:L("...يفكّر","Thinking...")});render();msgFx();
  const btn=$("#aiBtn");btn.disabled=true;const hist=S.chat.slice(0,-1).slice(-12);
  const turns=hist.map((m,k)=>({role:m.role,content:k===0?tutorBrief()+"\n\nStudent: "+m.content:m.content}));
  if(turns[0].role!=="user")turns.shift();
  const bubbles=()=>document.querySelectorAll("#chat .msg.ai");
  try{const sample=await getSample();if(!sample)throw{code:"unavailable"};
   const r=await sample(turns,{cache:false,onText:({text})=>{S.chat[S.chat.length-1].content=text;const b=bubbles();if(b.length)b[b.length-1].textContent=text}});
   S.chat[S.chat.length-1].content=r.text}
  catch(e){S.chat[S.chat.length-1].content=e&&e.code==="rate_limited"?L("طلبات كثيرة، انتظر قليلاً ثم أعد المحاولة.","Too many requests. Wait a moment and try again."):L("المساعد غير متاح في هذه المعاينة. في التطبيق النهائي يعمل عبر خادمك.","The tutor isn't available in this preview. In the real app it runs through your server.");if(e&&e.text)S.chat[S.chat.length-1].content=e.text}
  S.chat=S.chat.slice(-30);save();render()},
 async genEx(d,el){const out=$("#ex");out.hidden=false;out.textContent=L("...جارٍ التحضير","Preparing...");el.disabled=true;
  const b=branch(),c=CH[d.sub][+d.i];
  const p=`${tutorBrief()}\n\nWrite 3 original BAC-style exercises of increasing difficulty on the lesson "${c[1]} (${c[0]})" in ${SUB[d.sub][1]} for the ${b.n[1]} branch. Give one short hint per exercise, then full worked solutions at the end under a clear heading. Language: ${S.lang==="ar"?"Arabic":"English"}. Plain text, no LaTeX.`;
  try{const sample=await getSample();if(!sample)throw{code:"unavailable"};
   const r=await sample(p,{cache:false,onText:({text})=>{out.textContent=text}});out.textContent=r.text}
  catch(e){out.textContent=e&&e.text?e.text:L("المساعد غير متاح في هذه المعاينة.","The tutor isn't available in this preview.")}
  el.disabled=false},
 tSubmit(){const g=id=>$(id).value.trim();const n=g("#tn"),e=g("#te"),f=$("#tf").files[0];
  if(!n||!e||!g("#tsc"))return toast(L("أكمل الاسم والبريد والمؤسسة.","Fill in name, email and school."));
  if(!f)return toast(L("أرفق وثيقة تثبت أنك أستاذ.","Attach a document proving you teach."));
  if(!$("#tok").checked)return toast(L("أكّد صحة المعلومات.","Confirm the information is accurate."));
  S.teacher={name:n,email:e,phone:g("#tp"),sub:$("#ts").value,wilaya:$("#tw").value,school:g("#tsc"),doc:f.name,status:"pending"};save();stack=[];go("tPending",{},false)},
 tApprove(){S.teacher.status="verified";save();toast(L("تم توثيق حسابك","You're verified"));tab("tHome")},
 tPublish(){const u=$("#au").value.trim(),t=$("#at").value.trim();
  if(!t||!/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(u))return toast(L("أدخل عنواناً ورابط يوتيوب صحيحاً.","Enter a title and a valid YouTube link."));
  S.lessons.push({sub:$("#as").value,i:+$("#ac").value,ch:CH[$("#as").value][+$("#ac").value][0],title:t,url:u,teacher:S.teacher.name,email:S.teacher.email});save();toast(L("نُشر الدرس للتلاميذ","Published to students"));tab("tHome")},
 tReply(d){const q=S.questions.find(x=>x.id==d.id),r=$("#r"+d.id).value.trim();if(!r)return;q.reply=r;q.teacher=S.teacher.name;save();toast(L("أُرسل ردّك","Reply sent"));render()},
 tBuy(){S.tplus=true;save();toast(L("تم تفعيل Plus","Plus activated"));render()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener("input",e=>{const el=e.target;
 if(el.dataset.c==="note"){S.notes[el.dataset.k]=el.value;save()}
 if(el.dataset.c==="mark"){let v=el.value.replace(",",".");S.marks[el.dataset.sub]=v;save();
  const b=branch();let t=0,w=0;for(const s in b.s){const m=parseFloat(S.marks[s]);if(!isNaN(m)&&m>=0&&m<=20){t+=m*b.s[s];w+=b.s[s]}}
  const a=w?t/w:0;$("#avg").textContent=w?a.toFixed(2):"—";$("#avgm").textContent=w?(a>=10?L("ناجح","Pass"):L("دون المعدل","Below pass")):L("أدخل علاماتك المتوقعة","Enter your expected marks")}});
document.addEventListener("change",e=>{if(e.target.dataset.c==="curTri"){V.list[+e.target.dataset.i][2]=+e.target.value;return}if(e.target.dataset.c==="classAt"){const s=e.target.dataset.sub,v=e.target.value;if(v==="")delete S.classAt[s];else S.classAt[s]=+v;if(S.plan)S.plan=buildPlan({level:S.plan.level,hours:S.plan.hours,days:S.plan.days,order:S.plan.order,energy:S.plan.energy});save();toast(L("تم. خطتك تواكب قسمك الآن.","Done. Your plan now follows your class."));render();return}if(e.target.dataset.c==="tSub"){V.sub=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.target.id==="aiq"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();A.aiSend()}});
if(S.plan&&(!S.plan.start||Array.isArray(S.plan.weeks[0]))&&S.branch){try{S.plan=buildPlan({level:S.plan.level||"ontrack",hours:S.plan.hours||1.5,days:Math.min(6,S.plan.days||5)});save()}catch(e){S.plan=null}}
(()=>{const q=new URLSearchParams(location.search);if(q.has("paid")){const ok=q.get("paid")==="1";history.replaceState(null,"",location.pathname);
 if(ok){setTimeout(()=>toast(L("نؤكد الدفع…","Confirming your payment…")),600);pollSub()}else setTimeout(()=>toast(L("لم يكتمل الدفع.","The payment wasn't completed.")),600)}else refreshSub()})();
applyTheme();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.theme==="auto"){applyTheme();render()}})}catch(e){}
render();
})();
</script>
