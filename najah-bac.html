<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Najah — BAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2EF;--surface:#FFFFFF;--ink:#14211C;--muted:#5A6A63;--line:#D6DFDA;
  --green:#0B5D45;--green-ink:#FFFFFF;--green-soft:#DDEDE6;
  --red:#C4122F;--red-soft:#FBE3E7;--gold:#9A6F00;--gold-soft:#F6ECCF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1613;--surface:#16211D;--ink:#E7EEEA;--muted:#9AABA3;--line:#27352F;
  --green:#3DBA8C;--green-ink:#06231A;--green-soft:#163128;
  --red:#FF5C72;--red-soft:#3A1920;--gold:#E6BA4C;--gold-soft:#2E2715;}}
:root[data-theme="dark"]{
  --bg:#0E1613;--surface:#16211D;--ink:#E7EEEA;--muted:#9AABA3;--line:#27352F;
  --green:#3DBA8C;--green-ink:#06231A;--green-soft:#163128;
  --red:#FF5C72;--red-soft:#3A1920;--gold:#E6BA4C;--gold-soft:#2E2715;}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;min-height:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
#app{max-width:480px;margin:0 auto;padding:18px 18px 120px}
h1{font-size:28px;line-height:1.2;font-weight:700}
h2{font-size:21px;line-height:1.3;font-weight:700}
h3{font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:22px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:0;background:var(--green);color:var(--green-ink);font-weight:600;cursor:pointer;padding:0 16px;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{min-height:40px;width:auto;font-size:14px;padding:0 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:4px 0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;min-height:40px}
.back{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:20px;line-height:1}
[dir="rtl"] .back{transform:scaleX(-1)}
.lang{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--green-soft);color:var(--green)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.plain{background:var(--bg);color:var(--muted)}
.opt{display:block;width:100%;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.opt.on{border-color:var(--green);background:var(--green-soft)}
.opt b{display:block;font-size:17px}
.opt span{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.in{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
textarea.in{min-height:96px;resize:vertical}
.in:focus{outline:none;border-color:var(--green)}
/* the countdown: the one loud element */
.count{border:2px solid var(--ink);border-radius:18px;padding:18px 18px 14px;background:var(--surface);position:relative}
.count .num{font-size:76px;font-weight:700;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.count .lbl{font-size:17px;font-weight:600;margin-top:6px}
.count .date{font-size:13px;color:var(--muted);margin-top:2px}
.count::after{content:"";position:absolute;inset-inline-end:18px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--red)}
.steps{counter-reset:s;list-style:none}
.steps>li{counter-increment:s;position:relative;padding-inline-start:44px;padding-bottom:20px;border-inline-start:2px solid var(--line);margin-inline-start:15px}
.steps>li:last-child{border-color:transparent;padding-bottom:0}
.steps>li::before{content:counter(s);position:absolute;inset-inline-start:-16px;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--green);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:14px}
.lesson{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lesson:last-child{border:0}
.play{flex:none;width:42px;height:42px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:16px}
.lock{background:var(--gold-soft);border:1px solid var(--gold);border-radius:16px;padding:16px}
.msg{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.msg.me{background:var(--green);color:var(--green-ink);margin-inline-start:auto;border-end-end-radius:4px}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-end-start-radius:4px}
.chat{display:flex;flex-direction:column;gap:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{max-width:480px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;padding:9px 2px 10px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.nav button.on{color:var(--green);font-weight:700}
.nav svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start;cursor:pointer}
.tile b{display:block;font-size:15px}
.tile span{font-size:13px;color:var(--muted)}
.qopt{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.qopt.on{border-color:var(--green);background:var(--green-soft)}
.qopt.good{border-color:var(--green);background:var(--green-soft)}
.qopt.bad{border-color:var(--red);background:var(--red-soft)}
.wordmark{font-size:64px;font-weight:700;line-height:1;letter-spacing:-1px}
.ltr{direction:ltr;unicode-bidi:isolate}
hr{border:0;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav" hidden><div></div></nav>
<script>
/* ---------- data ---------- */
const BAC_DATE=new Date("2027-06-13T08:00:00");
const SUB={
 math:["الرياضيات","Mathematics"],physics:["العلوم الفيزيائية","Physics"],sciences:["علوم الطبيعة والحياة","Natural sciences"],
 arabic:["اللغة العربية وآدابها","Arabic"],philo:["الفلسفة","Philosophy"],french:["اللغة الفرنسية","French"],english:["اللغة الإنجليزية","English"],
 histgeo:["التاريخ والجغرافيا","History & geography"],islamic:["العلوم الإسلامية","Islamic studies"],tech:["التكنولوجيا","Technology"],
 accounting:["التسيير المحاسبي والمالي","Accounting & finance"],economics:["الاقتصاد والمناجمنت","Economics & management"],law:["القانون","Law"],lang3:["اللغة الأجنبية الثالثة","Third language"]};
const BR=[
 {id:"se",n:["علوم تجريبية","Experimental sciences"],s:{sciences:6,physics:5,math:5,arabic:3,philo:2,french:2,english:2,histgeo:2,islamic:2}},
 {id:"m",n:["رياضيات","Mathematics"],s:{math:7,physics:6,sciences:2,arabic:3,philo:2,french:2,english:2,histgeo:2,islamic:2}},
 {id:"tm",n:["تقني رياضي","Technical mathematics"],s:{tech:7,math:6,physics:6,arabic:3,philo:2,french:2,english:2,histgeo:2,islamic:2}},
 {id:"ge",n:["تسيير واقتصاد","Management & economics"],s:{accounting:6,economics:5,math:5,histgeo:4,arabic:3,law:2,philo:2,french:2,english:2,islamic:2}},
 {id:"lp",n:["آداب وفلسفة","Literature & philosophy"],s:{philo:6,arabic:6,histgeo:4,french:3,english:3,math:2,islamic:2}},
 {id:"le",n:["لغات أجنبية","Foreign languages"],s:{arabic:5,french:5,english:5,lang3:4,histgeo:3,philo:2,math:2,islamic:2}}];
const CH={
 math:[["المتتاليات العددية","Sequences"],["النهايات والاستمرارية","Limits & continuity"],["الاشتقاقية","Derivatives"],["الدالة الأسية","Exponential function"],["الدالة اللوغاريتمية","Logarithm function"],["الحساب التكاملي","Integrals"],["الاحتمالات","Probability"],["الأعداد المركبة","Complex numbers"],["الهندسة في الفضاء","Geometry in space"]],
 physics:[["التحولات النووية","Nuclear transformations"],["المتابعة الزمنية لتحول كيميائي","Chemical kinetics"],["الظواهر الكهربائية RC و RL","RC & RL circuits"],["تطور جملة ميكانيكية","Mechanics & Newton's laws"],["الاهتزازات الميكانيكية","Oscillations"],["التحولات الكيميائية في الاتجاهين","Acid–base equilibrium"],["الأسترة والإماهة","Esterification"]],
 sciences:[["تركيب البروتين","Protein synthesis"],["العلاقة بين بنية ووظيفة البروتين","Protein structure & function"],["النشاط الإنزيمي","Enzymes"],["دور البروتينات في الدفاع عن الذات","Immunity"],["الاتصال العصبي","Nerve communication"],["التركيب الضوئي","Photosynthesis"],["التنفس والتخمر","Respiration & fermentation"],["التكتونية العامة","Plate tectonics"]],
 philo:[["منهجية المقالة الفلسفية","Philosophical essay method"],["السؤال والمشكلة","Question & problem"],["الإحساس والإدراك","Sensation & perception"],["الذاكرة","Memory"],["اللغة والفكر","Language & thought"],["العلوم التجريبية والمنهج","Science & method"],["العدل والحقوق","Justice & rights"]],
 arabic:[["النصوص الأدبية","Literary texts"],["النحو والصرف","Grammar"],["البلاغة والعروض","Rhetoric & prosody"],["منهجية تحليل النص","Text analysis method"]],
 french:[["Le texte historique","Historical text"],["Le discours argumentatif","Argumentative discourse"],["L'appel","The appeal"],["La nouvelle fantastique","Fantastic short story"]],
 english:[["Ethics in business","Ethics in business"],["Safety first","Safety first"],["Ancient civilisations","Ancient civilisations"],["Astronomy","Astronomy"],["Writing & grammar","Writing & grammar"]],
 histgeo:[["الحرب الباردة","The Cold War"],["العالم الثالث","The Third World"],["الثورة الجزائرية","The Algerian revolution"],["القوى الاقتصادية الكبرى","Economic powers"],["التنمية في العالم","World development"],["الاقتصاد الجزائري","Algeria's economy"]],
 islamic:[["وسائل القرآن في تثبيت العقيدة","Quranic methods of faith"],["العقل في القرآن","Reason in the Quran"],["حقوق الإنسان في الإسلام","Human rights in Islam"],["الأسرة في الإسلام","The family in Islam"],["المعاملات المالية","Financial dealings"]],
 tech:[["الأنظمة الآلية","Automated systems"],["الدارات المنطقية","Logic circuits"],["مقاومة المواد","Material strength"],["البناء الميكانيكي","Mechanical construction"]],
 accounting:[["الاهتلاكات","Depreciation"],["المؤونات","Provisions"],["أعمال نهاية الدورة","Year-end adjustments"],["تحليل القوائم المالية","Financial statements"],["محاسبة التكاليف","Cost accounting"]],
 economics:[["النقود","Money"],["السوق والأسعار","Market & prices"],["البنوك","Banking"],["التجارة الخارجية","International trade"],["البطالة والتضخم","Unemployment & inflation"]],
 law:[["الشركات التجارية","Commercial companies"],["عقد العمل","Labour contract"],["القانون الجبائي","Tax law"]],
 lang3:[["القواعد","Grammar"],["فهم النص","Reading"],["التعبير الكتابي","Writing"]]};
const QZ={
 math:[
  {q:["مشتقة الدالة f(x) = e^(2x) هي:","The derivative of f(x) = e^(2x) is:"],o:["e^(2x)","2e^(2x)","2x·e^(2x)","e^(2x)/2"],a:1},
  {q:["نهاية ln(x)/x عندما x يؤول إلى +∞ هي:","The limit of ln(x)/x as x → +∞ is:"],o:["0","1","+∞","−∞"],a:0},
  {q:["قيمة التكامل ∫ من 0 إلى 1 لـ 2x dx هي:","∫ from 0 to 1 of 2x dx equals:"],o:["2","1/2","1","0"],a:2},
  {q:["المتتالية u(n) = 3×2^n هندسية أساسها:","u(n) = 3×2^n is geometric with ratio:"],o:["3","2","6","1/2"],a:1},
  {q:["A و B مستقلان، P(A)=0.5 و P(B)=0.4. إذن P(A∩B) =","A, B independent, P(A)=0.5, P(B)=0.4. P(A∩B) ="],o:["0.9","0.1","0.2","0.45"],a:2}],
 physics:[
  {q:["بعد مرور نصفي عمر، يتبقى من الأنوية المشعة:","After two half-lives, the remaining fraction of nuclei is:"],o:["1/2","1/4","1/8","0"],a:1},
  {q:["ثابت الزمن لدارة RC حيث R = 1 kΩ و C = 100 µF:","Time constant of RC with R = 1 kΩ, C = 100 µF:"],o:["0.01 s","1 s","0.1 s","10 s"],a:2},
  {q:["القانون الثاني لنيوتن:","Newton's second law:"],o:["ΣF = m·v","ΣF = m·a","F = m·g·h","ΣF = 0"],a:1},
  {q:["نشاط عينة مشعة يساوي:","Activity of a radioactive sample equals:"],o:["A = λ·N","A = N/λ","A = λ/N","A = N·t"],a:0}],
 sciences:[
  {q:["تتم الترجمة على مستوى:","Translation takes place at the:"],o:["النواة / nucleus","الريبوزوم / ribosome","الميتوكوندري / mitochondria","الغشاء / membrane"],a:1},
  {q:["الخلايا المنتجة للأجسام المضادة هي:","Antibodies are produced by:"],o:["LT8","البلعميات / macrophages","الخلايا البلازمية / plasma cells","LT4"],a:2},
  {q:["تحدث المرحلة الكيموضوئية في:","The light-dependent phase occurs in the:"],o:["الحشوة / stroma","التيلاكويد / thylakoid","الهيولى / cytoplasm","النواة / nucleus"],a:1},
  {q:["يرتبط الإنزيم بمادة التفاعل على مستوى:","An enzyme binds its substrate at the:"],o:["الموقع الفعال / active site","الغشاء / membrane","الريبوزوم / ribosome","DNA"],a:0}]};

/* ---------- state ---------- */
let S=null;try{S=JSON.parse(localStorage.getItem("najah"))}catch(e){}
S=Object.assign({lang:"ar",role:null,user:null,guest:false,branch:null,hardest:null,plus:false,done:{},notes:{},questions:[],lessons:[],teacher:null,tplus:false,chat:[],days:[],marks:{}},S||{});
function save(){try{localStorage.setItem("najah",JSON.stringify(S))}catch(e){}}
const L=(a,e)=>S.lang==="ar"?a:e;
const N=arr=>arr[S.lang==="ar"?0:1];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const branch=()=>BR.find(b=>b.id===S.branch);
const coef=s=>branch()?.s[s]||0;
const prog=s=>{const c=CH[s]||[];return c.length?c.filter((_,i)=>S.done[s+":"+i]).length/c.length:0};
const daysLeft=()=>Math.max(0,Math.ceil((BAC_DATE-new Date())/864e5));
function today(){return new Date().toISOString().slice(0,10)}
function touch(){const t=today();if(S.days[S.days.length-1]!==t){S.days.push(t);S.days=S.days.slice(-60);save()}}
function streak(){let n=0,d=new Date();for(let i=S.days.length-1;i>=0;i--){const k=d.toISOString().slice(0,10);if(S.days[i]===k){n++;d.setDate(d.getDate()-1)}else break}return n}
function nextUp(){const b=branch();if(!b)return[];const out=[];for(const s in b.s){const c=CH[s]||[];const i=c.findIndex((_,k)=>!S.done[s+":"+k]);if(i<0)continue;out.push({s,i,score:b.s[s]*(1-prog(s))*(s===S.hardest?1.6:1)})}return out.sort((a,b)=>b.score-a.score)}

let V={s:start()};let stack=[];
function start(){if(S.role==="teacher"&&S.teacher)return S.teacher.status==="verified"?"tHome":"tPending";if(S.role==="student"&&(S.user||S.guest)){if(!S.branch)return"branch";if(!S.hardest)return"hardest";return"home"}return"welcome"}
function go(s,p={},push=true){if(push)stack.push(V);V={s,...p};render();window.scrollTo(0,0)}
function back(){V=stack.pop()||{s:start()};render();window.scrollTo(0,0)}
function tab(s){stack=[];V={s};render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- AI (sample capability) ---------- */
let sampleP=null;
function getSample(){if(!sampleP)sampleP=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null);return sampleP}
function tutorBrief(){const b=branch();return `You are "Najah", an AI tutor for Algerian students preparing the baccalaureate (BAC), final year of secondary school, official Algerian curriculum. Student branch: ${b?b.n[1]:"unknown"}. Subject they find hardest: ${S.hardest?SUB[S.hardest][1]:"unknown"}. Reply in the language the student writes in (Arabic, French or English); default: ${S.lang==="ar"?"Arabic":"English"}. Explain step by step with BAC methodology, be concise and encouraging, write math as plain text (no LaTeX). For exercises, guide first, then give the full solution.`}

/* ---------- icons ---------- */
const IC={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
 test:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
 ai:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>',
 me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
 inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 14h5l1 2h4l1-2h5"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.8 6 6.2.6-4.7 4.2 1.4 6.2L12 17l-5.7 3 1.4-6.2L3 9.6 9.2 9z"/></svg>'};

/* ---------- shared bits ---------- */
const langBtn=()=>`<button class="lang" data-a="lang">${L("English","العربية")}</button>`;
const top=(title="",showBack=true)=>`<div class="top">${showBack?`<button class="back" data-a="back" aria-label="${L("رجوع","Back")}">←</button>`:"<span></span>"}<h3>${esc(title)}</h3>${langBtn()}</div>`;
const plusChip=()=>S.plus?`<span class="chip gold">Plus</span>`:"";
function lockCard(what){return `<div class="lock stack"><h3>${L("متاح مع نجاح Plus","Included in Najah Plus")}</h3><p class="small">${what}</p><button class="btn gold" data-a="goto" data-s="plus">${L("اشترك بـ 2,000 دج","Get Plus for 2,000 DA")}</button></div>`}

SC.home=()=>{const b=branch(),up=nextUp(),first=up[0],name=S.user?S.user.name:L("ضيف","guest");
return `<div class="top"><div><h3>${L("مرحباً","Hi")} ${esc(name)} ${plusChip()}</h3><span class="small muted">${N(b.n)}</span></div>${langBtn()}</div>
<div class="stack-lg">

 ${first?`<div class="card stack"><div class="row spread"><h3>${L("ابدأ من هنا","Start here")}</h3><span class="chip">${N(SUB[first.s])} ×${coef(first.s)}</span></div>

 <div class="grid2">

  <button class="tile" data-a="tab" data-s="ai"><b>${L("المساعد الذكي","AI tutor")}</b><span>${S.plus?L("اسأل أي سؤال","Ask anything"):"Plus"}</span></button>
  <button class="tile" data-a="tab" data-s="subjects"><b>${L("كل المواد","All subjects")}</b><span>${Object.keys(b.s).length} ${L("مواد","subjects")}</span></button>

</div>`};

SC.subjects=()=>{const b=branch();return `${top(L("المواد","Subjects"),false)}
<div class="stack">${Object.entries(b.s).sort((x,y)=>y[1]-x[1]).map(([s,c])=>{const p=Math.round(prog(s)*100);return `<button class="opt" data-a="goto" data-s="subject" data-sub="${s}">
 <div class="row spread"><b>${N(SUB[s])}</b><span class="chip ${s===S.hardest?"red":"plain"}">${s===S.hardest?L("تركيزك","Your focus"):L("المعامل","coef.")+" "+c}</span></div>
 <div class="bar" style="margin-top:10px"><i style="width:${p}%"></i></div><span>${p}% · ${(CH[s]||[]).length} ${L("دروس","lessons")}</span></button>`}).join("")}</div>`};

SC.subject=()=>{const s=V.sub;return `${top(N(SUB[s]))}
<div class="stack"><p class="muted small">${L("المعامل","Coefficient")} ${coef(s)} · ${Math.round(prog(s)*100)}% ${L("مكتمل","done")}</p>
${CH[s].map((c,i)=>{const d=S.done[s+":"+i];const n=S.lessons.filter(l=>l.sub===s&&+l.i===i).length;return `<button class="opt ${d?"on":""}" data-a="goto" data-s="chapter" data-sub="${s}" data-i="${i}"><b style="font-size:16px">${d?"✓ ":""}${N(c)}</b><span>${n?n+" "+L("درس من أساتذة موثَّقين","verified lesson(s)"):L("ابحث عن شرح أو انتظر الأساتذة","Search for a lesson or wait for teachers")}</span></button>`}).join("")}
${QZ[s]?`<button class="btn ghost" data-a="goto" data-s="quiz" data-sub="${s}">${L("اختبار سريع في هذه المادة","Quick quiz in this subject")}</button>`:""}</div>`};

SC.chapter=()=>{const s=V.sub,i=+V.i,c=CH[s][i],key=s+":"+i,d=S.done[key];
const ls=S.lessons.filter(l=>l.sub===s&&+l.i===i);
const qs=S.questions.filter(q=>q.key===key&&S.user&&q.by===S.user.email);
const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(c[0]+" "+SUB[s][0]+" بكالوريا");
const nx=nextUp().filter(x=>!(x.s===s&&x.i===i))[0];
return `${top(N(SUB[s]))}
<div class="stack-lg"><h2>${N(c)}</h2>
<ol class="steps">
 <li class="stack"><h3>${L("شاهد الدرس","Watch the lesson")}</h3>
  ${ls.length?`<div class="card">${ls.map(l=>`<div class="lesson"><a class="play" href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="${L("تشغيل","Play")}">▶</a><div><b>${esc(l.title)}</b><div class="small muted">${esc(l.teacher)} <span class="chip">✓ ${L("موثَّق","Verified")}</span></div></div></div>`).join("")}</div>`
  :`<p class="small muted">${L("لم ينشر أي أستاذ موثَّق هذا الدرس بعد.","No verified teacher has published this lesson yet.")}</p>`}
  <a class="btn ghost sm" href="${yt}" target="_blank" rel="noopener">${L("ابحث عن شرح على يوتيوب","Search YouTube for this lesson")}</a></li>
 <li class="stack"><h3>${L("اكتب ملخّصك","Write your summary")}</h3>
  <p class="small muted">${L("القواعد والتعاريف والطرائق بكلماتك. التلخيص يثبّت الفهم.","Rules, definitions and methods in your own words. Summarising locks it in.")}</p>
  <textarea class="in" data-c="note" data-k="${key}" placeholder="${L("ملخصي...","My summary...")}">${esc(S.notes[key]||"")}</textarea></li>
 <li class="stack"><h3>${L("تمرّن","Practise")}</h3>
  ${S.plus?`<button class="btn sm" data-a="genEx" data-sub="${s}" data-i="${i}">${L("ولّد 3 تمارين بنمط البكالوريا","Generate 3 BAC-style exercises")}</button><div id="ex" class="card small" hidden style="white-space:pre-wrap"></div>`
  :lockCard(L("تمارين بنمط البكالوريا يولّدها المساعد الذكي مع الحلول.","BAC-style exercises generated by the AI tutor, with solutions."))}
  ${QZ[s]?`<button class="btn ghost sm" data-a="goto" data-s="quiz" data-sub="${s}">${L("اختبار سريع","Quick quiz")}</button>`:""}</li>
 <li class="stack"><h3>${L("اسأل أستاذاً","Ask a teacher")}</h3>
  ${S.user?`<textarea class="in" id="askq" placeholder="${L("ما الذي لم تفهمه؟","What didn't you understand?")}"></textarea><button class="btn sm" data-a="ask" data-k="${key}" data-sub="${s}">${L("أرسل السؤال","Send question")}</button>
   ${qs.map(q=>`<div class="card small"><b>${esc(q.text)}</b><p class="${q.reply?"":"muted"}" style="margin-top:6px">${q.reply?esc(q.teacher)+": "+esc(q.reply):L("في انتظار رد أستاذ","Waiting for a teacher's reply")}</p></div>`).join("")}`
  :`<p class="small muted">${L("أنشئ حساباً لتطرح أسئلتك على الأساتذة.","Create an account to ask teachers.")}</p><button class="btn ghost sm" data-a="goto" data-s="studentAuth">${L("إنشاء حساب","Create account")}</button>`}</li>
</ol>
<button class="btn ${d?"ghost":""}" data-a="done" data-k="${key}">${d?L("إلغاء: لم أنهِ الدرس","Mark as not done"):L("أنهيت هذا الدرس","I've finished this lesson")}</button>
${d&&nx?`<div class="card stack pop"><h3>${L("ماذا بعد؟","What next?")}</h3><p>${N(CH[nx.s][nx.i])} <span class="chip">${N(SUB[nx.s])}</span></p><button class="btn" data-a="goto" data-s="chapter" data-sub="${nx.s}" data-i="${nx.i}">${L("انتقل إلى الدرس التالي","Go to the next lesson")}</button></div>`:""}
</div>`};

SC.tests=()=>{const b=branch();return `${top(L("الاختبارات","Tests"),false)}
<div class="stack-lg">
 <div class="stack"><h3>${L("اختبارات سريعة (مجانية)","Quick quizzes (free)")}</h3>
 ${Object.keys(b.s).filter(s=>QZ[s]).map(s=>`<button class="opt" data-a="goto" data-s="quiz" data-sub="${s}"><b style="font-size:16px">${N(SUB[s])}</b><span>${QZ[s].length} ${L("أسئلة، النتيجة على 20","questions, scored out of 20")}</span></button>`).join("")||`<p class="muted small">${L("تُضاف قريباً لمواد شعبتك.","Coming soon for your branch.")}</p>`}</div>
 <div class="stack"><h3>${L("مكتبة مواضيع البكالوريا","Past BAC paper library")} ${plusChip()}</h3>
 ${S.plus?`<div class="card">${[2025,2024,2023,2022,2021,2020,2019,2018].map(y=>`<div class="lesson"><b style="flex:1">BAC ${y}</b>${Object.keys(b.s).slice(0,3).map(s=>`<button class="chip plain" style="border:0;cursor:pointer" data-a="paper">${N(SUB[s])}</button>`).join(" ")}</div>`).join("")}</div>`
 :lockCard(L("كل مواضيع البكالوريا من 2008 مع التصحيح النموذجي، مرتّبة حسب الشعبة والدرس، وامتحانات تجريبية بالتوقيت.","Every BAC paper since 2008 with official answer keys, sorted by branch and lesson, plus timed mock exams."))}</div>
</div>`};

SC.quiz=()=>{const s=V.sub,qs=QZ[s],a=V.ans||{},sub=V.submitted;
const score=sub?Math.round(qs.filter((q,k)=>a[k]===q.a).length/qs.length*20):0;
return `${top(N(SUB[s]))}
<div class="stack-lg">${sub?`<div class="count pop"><div class="num">${score}/20</div><div class="lbl">${score>=10?L("أحسنت! واصل.","Well done, keep going."):L("راجع الدروس ثم أعد المحاولة.","Review the lessons, then try again.")}</div></div>`:""}
${qs.map((q,k)=>`<div class="card"><b>${k+1}. <span>${esc(N(q.q))}</span></b>${q.o.map((o,j)=>{let cl="";if(sub){if(j===q.a)cl="good";else if(a[k]===j)cl="bad"}else if(a[k]===j)cl="on";return `<button class="qopt ${cl}" data-a="qpick" data-k="${k}" data-j="${j}" ${sub?"disabled":""}><span class="ltr">${esc(o)}</span></button>`}).join("")}</div>`).join("")}
${sub?`<button class="btn ghost" data-a="qreset">${L("أعد الاختبار","Retake")}</button>`:`<button class="btn" data-a="qsubmit">${L("صحّح إجاباتي","Check my answers")}</button>`}</div>`};

SC.ai=()=>`${top(L("المساعد الذكي","AI tutor"),false)}
${!S.plus?lockCard(L("مساعد ذكي يعرف منهاج البكالوريا الجزائري: يشرح خطوة بخطوة، يصحّح حلولك، ويعطيك تمارين حسب شعبتك.","An AI that knows the Algerian BAC curriculum: step-by-step explanations, checks your solutions, and gives exercises for your branch."))
:`<div class="chat" id="chat">${S.chat.length?S.chat.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join(""):`<div class="card small muted">${L("اسألني عن أي درس، مثلاً: اشرح لي كيف أدرس تغيرات دالة أسية.","Ask about any lesson, e.g. explain how to study the variations of an exponential function.")}</div>`}</div>
<div style="position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding-top:12px;background:var(--bg)"><div class="row"><textarea class="in" id="aiq" rows="1" style="min-height:48px" placeholder="${L("اكتب سؤالك...","Type your question...")}"></textarea><button class="btn sm" data-a="aiSend" id="aiBtn">${L("إرسال","Send")}</button></div>
${S.chat.length?`<button class="link small" data-a="aiClear">${L("محادثة جديدة","New conversation")}</button>`:""}</div>`}`;

SC.me=()=>{const b=branch();return `${top(L("حسابي","Me"),false)}
<div class="stack">
 <div class="card stack"><h3>${S.user?esc(S.user.name):L("ضيف","Guest")} ${plusChip()}</h3>
  <p class="small muted">${N(b.n)} · ${L("تركيزك","Focus")}: ${N(SUB[S.hardest])}</p>
  ${!S.user?`<button class="btn sm" data-a="goto" data-s="studentAuth">${L("أنشئ حساباً","Create account")}</button>`:""}</div>
 <button class="opt" data-a="goto" data-s="branch"><b style="font-size:16px">${L("تغيير الشعبة","Change branch")}</b></button>
 <button class="opt" data-a="goto" data-s="hardest"><b style="font-size:16px">${L("تغيير المادة الأصعب","Change hardest subject")}</b></button>
 <button class="opt" data-a="goto" data-s="sim"><b style="font-size:16px">${L("حاسبة المعدل","Grade calculator")}</b></button>
 <button class="opt" data-a="goto" data-s="plus"><b style="font-size:16px">${S.plus?L("اشتراك Plus مفعّل","Plus is active"):L("نجاح Plus","Najah Plus")}</b></button>
 <button class="btn ghost" data-a="reset">${L("تسجيل الخروج ومسح البيانات","Sign out and clear data")}</button>
</div>`};

SC.sim=()=>{const b=branch();let t=0,w=0;for(const s in b.s){const m=parseFloat(S.marks[s]);if(!isNaN(m)){t+=m*b.s[s];w+=b.s[s]}}const avg=w?(t/w):0;
return `${top(L("حاسبة المعدل","Grade calculator"))}
<div class="stack-lg"><div class="count"><div class="num" id="avg">${w?avg.toFixed(2):"—"}</div><div class="lbl">${L("معدلك المتوقع على 20","Your estimated average / 20")}</div><div class="date" id="avgm">${w?(avg>=10?L("ناجح","Pass"):L("دون المعدل","Below pass")):L("أدخل علاماتك المتوقعة","Enter your expected marks")}</div></div>
<div class="card">${Object.entries(b.s).map(([s,c])=>`<div class="lesson"><div style="flex:1"><b>${N(SUB[s])}</b><div class="small muted">${L("المعامل","Coefficient")} ${c}</div></div><input class="in ltr" style="width:84px;text-align:center" inputmode="decimal" data-c="mark" data-sub="${s}" value="${esc(S.marks[s]??"")}" placeholder="/20"></div>`).join("")}</div>
<p class="small muted">${L("المعاملات تقريبية؛ تحقق منها في منشور الديوان الوطني للامتحانات والمسابقات.","Coefficients are approximate; check them against the ONEC publication.")}</p></div>`};

SC.plus=()=>`${top("Najah Plus")}
<div class="stack-lg"><div class="count" style="border-color:var(--gold)"><div class="num">2,000</div><div class="lbl">${L("دينار جزائري","Algerian dinars")}</div><div class="date">${L("حتى يوم البكالوريا","Until BAC day")}</div></div>
<div class="card"><ul class="small" style="padding-inline-start:18px;display:grid;gap:8px">
 <li>${L("مكتبة كاملة لمواضيع البكالوريا السابقة مع التصحيح","Full past BAC paper library with answer keys")}</li>
 <li>${L("امتحانات تجريبية بالتوقيت وتنقيط على 20","Timed mock exams scored out of 20")}</li>
 <li>${L("مساعد ذكي خاص بالبكالوريا","A BAC-specialised AI tutor")}</li>
 <li>${L("تمارين بنمط البكالوريا لكل درس","BAC-style exercises for every lesson")}</li>
 <li>${L("تحميل الدروس للمراجعة دون إنترنت","Download lessons to study offline")}</li>
 <li>${L("أولوية في ردود الأساتذة","Priority replies from teachers")}</li></ul></div>
${S.plus?`<p class="chip gold">${L("مفعّل","Active")}</p>`:S.user?`<button class="btn gold" data-a="buyPlus">${L("اشترك (تجريبي)","Subscribe (demo)")}</button><p class="small muted">${L("الدفع الحقيقي عبر Google Play وApp Store يُربط عند الإطلاق.","Real payment via Google Play and the App Store is connected at launch.")}</p>`
:`<p class="small muted">${L("الاشتراك يتطلب حساباً.","Plus needs an account.")}</p><button class="btn" data-a="goto" data-s="studentAuth">${L("إنشاء حساب","Create account")}</button>`}</div>`;

/* ----- teacher ----- */
const WIL=["Adrar","Chlef","Laghouat","Oum El Bouaghi","Batna","Béjaïa","Biskra","Béchar","Blida","Bouira","Tamanrasset","Tébessa","Tlemcen","Tiaret","Tizi Ouzou","Alger","Djelfa","Jijel","Sétif","Saïda","Skikda","Sidi Bel Abbès","Annaba","Guelma","Constantine","Médéa","Mostaganem","M'Sila","Mascara","Ouargla","Oran","El Bayadh","Illizi","Bordj Bou Arréridj","Boumerdès","El Tarf","Tindouf","Tissemsilt","El Oued","Khenchela","Souk Ahras","Tipaza","Mila","Aïn Defla","Naâma","Aïn Témouchent","Ghardaïa","Relizane"];
SC.tSignup=()=>`${top(L("تسجيل أستاذ","Teacher sign-up"))}
<div class="stack"><p class="small muted">${L("نوثّق كل أستاذ قبل ظهور دروسه للتلاميذ.","We verify every teacher before their lessons reach students.")}</p>
 <div><label class="f" for="tn">${L("الاسم الكامل","Full name")}</label><input class="in" id="tn" autocomplete="name"></div>
 <div><label class="f" for="te">${L("البريد الإلكتروني","Email")}</label><input class="in ltr" id="te" type="email"></div>
 <div><label class="f" for="tp">${L("رقم الهاتف","Phone")}</label><input class="in ltr" id="tp" inputmode="tel"></div>
 <div><label class="f" for="ts">${L("المادة","Subject")}</label><select class="in" id="ts">${Object.keys(SUB).map(s=>`<option value="${s}">${N(SUB[s])}</option>`).join("")}</select></div>
 <div><label class="f" for="tw">${L("الولاية","Wilaya")}</label><select class="in" id="tw">${WIL.map((w,i)=>`<option>${String(i+1).padStart(2,"0")} ${w}</option>`).join("")}</select></div>
 <div><label class="f" for="tsc">${L("المؤسسة التي تدرّس فيها","School you teach at")}</label><input class="in" id="tsc"></div>
 <div><label class="f" for="tf">${L("صورة البطاقة المهنية أو قرار التعيين","Professional card or appointment decision")}</label><input class="in" id="tf" type="file" accept="image/*,.pdf"></div>
 <label class="row small"><input type="checkbox" id="tok"> ${L("أؤكد أن المعلومات صحيحة وأوافق على التحقق منها.","I confirm this is accurate and agree to its verification.")}</label>
 <button class="btn" data-a="tSubmit">${L("إرسال طلب التوثيق","Submit for verification")}</button></div>`;

SC.tPending=()=>`${top(L("طلب التوثيق","Verification"),false)}
<div class="stack-lg"><h2>${L("طلبك قيد المراجعة","Your application is under review")}</h2>
<ol class="steps">
 <li><h3>${L("استلمنا طلبك","Application received")} ✓</h3><p class="small muted">${esc(S.teacher.name)} · ${N(SUB[S.teacher.sub])}</p></li>
 <li><h3>${L("مراجعة الوثيقة","Document check")}</h3><p class="small muted">${L("نطابق البطاقة المهنية مع الاسم والمؤسسة.","We match your professional card with your name and school.")}</p></li>
 <li><h3>${L("مكالمة قصيرة","Short call")}</h3><p class="small muted">${L("مكالمة فيديو 10 دقائق مع فريق نجاح.","A 10-minute video call with the Najah team.")}</p></li>
 <li><h3>${L("التفعيل","Activation")}</h3><p class="small muted">${L("تحصل على شارة الأستاذ الموثَّق وتبدأ النشر.","You get the verified badge and can start publishing.")}</p></li></ol>
<button class="btn ghost" data-a="tApprove">${L("قبول الطلب (تجريبي: دور المشرف)","Approve (demo: admin role)")}</button>
<button class="link" data-a="reset">${L("تسجيل الخروج","Sign out")}</button></div>`;

SC.tHome=()=>{const t=S.teacher,mine=S.lessons.filter(l=>l.email===t.email),wait=S.questions.filter(q=>q.sub===t.sub&&!q.reply);
return `<div class="top"><div><h3>${esc(t.name)} <span class="chip">✓ ${L("موثَّق","Verified")}</span> ${S.tplus?'<span class="chip gold">Plus</span>':""}</h3><span class="small muted">${N(SUB[t.sub])}</span></div>${langBtn()}</div>
<div class="stack-lg"><div class="grid2">
 <div class="card"><div style="font-size:34px;font-weight:700">${mine.length}</div><div class="small muted">${L("دروس منشورة","Lessons published")}</div></div>
 <div class="card"><div style="font-size:34px;font-weight:700;color:${wait.length?"var(--red)":"inherit"}">${wait.length}</div><div class="small muted">${L("أسئلة بانتظارك","Questions waiting")}</div></div></div>
<button class="btn" data-a="tab" data-s="tAdd">${L("انشر درساً","Publish a lesson")}</button>
<div class="stack"><h3>${L("دروسك","Your lessons")}</h3>${mine.length?`<div class="card">${mine.map(l=>`<div class="lesson"><span class="play">▶</span><div><b>${esc(l.title)}</b><div class="small muted">${N(CH[l.sub][l.i])}</div></div></div>`).join("")}</div>`:`<p class="small muted">${L("انشر درسك الأول ليظهر للتلاميذ في خطوة «شاهد الدرس».","Publish your first lesson; students see it in the “Watch the lesson” step.")}</p>`}</div>
<button class="link" data-a="reset">${L("تسجيل الخروج","Sign out")}</button></div>`};

SC.tAdd=()=>{const t=S.teacher,s=V.sub||t.sub;return `${top(L("نشر درس","Publish a lesson"),false)}
<div class="stack">
 <div><label class="f" for="as">${L("المادة","Subject")}</label><select class="in" id="as" data-c="tSub">${Object.keys(SUB).map(k=>`<option value="${k}" ${k===s?"selected":""}>${N(SUB[k])}</option>`).join("")}</select></div>
 <div><label class="f" for="ac">${L("الدرس","Lesson")}</label><select class="in" id="ac">${CH[s].map((c,i)=>`<option value="${i}">${N(c)}</option>`).join("")}</select></div>
 <div><label class="f" for="at">${L("عنوان الفيديو","Video title")}</label><input class="in" id="at"></div>
 <div><label class="f" for="au">${L("رابط الفيديو (يوتيوب)","Video link (YouTube)")}</label><input class="in ltr" id="au" inputmode="url" placeholder="https://youtube.com/..."></div>
 <button class="btn" data-a="tPublish">${L("انشر","Publish")}</button></div>`};

SC.tQ=()=>{const t=S.teacher,qs=S.questions.filter(q=>q.sub===t.sub);return `${top(L("أسئلة التلاميذ","Student questions"),false)}
<div class="stack">${qs.length?qs.map(q=>`<div class="card stack"><span class="chip plain">${N(CH[q.sub][+q.key.split(":")[1]])}</span><b>${esc(q.text)}</b><span class="small muted">${esc(q.name)}</span>
 ${q.reply?`<p class="small">${L("ردك","Your reply")}: ${esc(q.reply)}</p>`:`<textarea class="in" id="r${q.id}" placeholder="${L("اكتب ردك...","Write your reply...")}"></textarea><button class="btn sm" data-a="tReply" data-id="${q.id}">${L("أرسل الرد","Send reply")}</button>`}</div>`).join("")
 :`<p class="muted small">${L("لا توجد أسئلة في مادتك بعد.","No questions in your subject yet.")}</p>`}</div>`};

SC.tPlus=()=>`${top(L("Plus للأساتذة","Teacher Plus"),false)}
<div class="stack-lg"><div class="count" style="border-color:var(--gold)"><div class="num">3,000</div><div class="lbl">${L("دج شهرياً","DA per month")}</div></div>
<div class="card"><ul class="small" style="padding-inline-start:18px;display:grid;gap:8px">
 <li>${L("ظهور مميّز في توصيات «شاهد الدرس»","Featured placement in “Watch the lesson” recommendations")}</li>
 <li>${L("إحصائيات: المشاهدات، نسبة الإكمال، الولايات","Analytics: views, completion rate, wilayas")}</li>
 <li>${L("حصص مباشرة مع التلاميذ","Live classes with students")}</li>
 <li>${L("حجز حصص خاصة مدفوعة","Paid private-session booking")}</li>
 <li>${L("نشر غير محدود للدروس","Unlimited lesson uploads")}</li></ul></div>
${S.tplus?`<p class="chip gold">${L("مفعّل","Active")}</p>`:`<button class="btn gold" data-a="tBuy">${L("اشترك (تجريبي)","Subscribe (demo)")}</button>`}</div>`;

/* ---------- nav ---------- */
const SNAV=[["home","home",["الرئيسية","Home"]],["subjects","book",["المواد","Subjects"]],["tests","test",["اختبارات","Tests"]],["ai","ai",["المساعد","Tutor"]],["me","me",["حسابي","Me"]]];
const TNAV=[["tHome","home",["لوحتي","Dashboard"]],["tAdd","up",["نشر","Publish"]],["tQ","inbox",["الأسئلة","Questions"]],["tPlus","star",["Plus","Plus"]]];
const SROOT={home:1,subjects:1,tests:1,ai:1,me:1,subject:"subjects",chapter:"subjects",quiz:"tests",sim:"me",plus:"me"};

function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 $("#app").innerHTML=SC[V.s]();
 const nav=$("#nav");let items=null,cur=V.s;
 if(S.role==="student"&&SROOT[V.s]&&!(V.s==="plus"&&!S.branch)){items=SNAV;if(SROOT[V.s]!==1)cur=SROOT[V.s]}
 if(S.role==="teacher"&&["tHome","tAdd","tQ","tPlus"].includes(V.s))items=TNAV;
 nav.hidden=!items;
 if(items)nav.firstElementChild.innerHTML=items.map(([s,ic,n])=>`<button class="${s===cur?"on":""}" data-a="tab" data-s="${s}" ${s===cur?'aria-current="page"':""}>${IC[ic]}${N(n)}</button>`).join("");
 const ch=$("#chat");if(ch)ch.lastElementChild?.scrollIntoView({block:"end"});
}

/* ---------- actions ---------- */
const A={
 back,lang(){S.lang=S.lang==="ar"?"en":"ar";save();render()},
 goto(d){go(d.s,{sub:d.sub,i:d.i})},tab(d){tab(d.s)},
 role(d){S.role=d.r;save();go(d.r==="student"?"studentAuth":"tSignup")},
 signup(){const n=$("#nm").value.trim(),e=$("#em").value.trim(),p=$("#pw").value;
  if(!n||!e||p.length<6)return toast(L("أدخل الاسم والبريد وكلمة مرور من 6 أحرف على الأقل.","Enter a name, email and a password of 6+ characters."));
  S.user={name:n,email:e};S.guest=false;save();toast(L("تم إنشاء حسابك","Account created"));stack=[];go(S.branch?(S.hardest?"home":"hardest"):"branch",{},false)},
 guest(){S.guest=true;save();stack=[];go("branch",{},false)},
 pickBranch(d){const changed=S.branch&&S.branch!==d.b;S.branch=d.b;if(changed||!branch().s[S.hardest])S.hardest=null;save();go("hardest")},
 pickHard(d){S.hardest=d.sub;save();touch();stack=[];go("home",{},false)},
 done(d){S.done[d.k]=!S.done[d.k];touch();save();if(S.done[d.k])toast(L("أحسنت! تم تسجيل تقدّمك.","Nice work! Progress saved."));render()},
 ask(d){const t=$("#askq").value.trim();if(!t)return toast(L("اكتب سؤالك أولاً.","Write your question first."));
  S.questions.push({id:Date.now(),key:d.k,sub:d.sub,text:t,by:S.user.email,name:S.user.name,reply:null});save();toast(L("أُرسل سؤالك إلى أساتذة المادة.","Question sent to this subject's teachers."));render()},
 qpick(d){V.ans=Object.assign({},V.ans,{[d.k]:+d.j});render()},
 qsubmit(){if(Object.keys(V.ans||{}).length<QZ[V.sub].length)return toast(L("أجب عن كل الأسئلة.","Answer every question."));V.submitted=true;touch();render();window.scrollTo(0,0)},
 qreset(){V.ans={};V.submitted=false;render();window.scrollTo(0,0)},
 paper(){toast(L("تُضاف ملفات المواضيع من الأرشيف الرسمي قبل الإطلاق.","Paper PDFs are added from the official archive before launch."))},
 buyPlus(){S.plus=true;save();toast(L("تم تفعيل Plus","Plus activated"));render()},
 reset(){if(!confirm(L("سيتم مسح كل بياناتك على هذا الجهاز.","This clears all your data on this device.")))return;localStorage.removeItem("najah");location.reload()},
 aiClear(){S.chat=[];save();render()},
 async aiSend(){const box=$("#aiq"),q=box.value.trim();if(!q)return;box.value="";
  S.chat.push({role:"user",content:q});S.chat.push({role:"assistant",content:L("...يفكّر","Thinking...")});render();
  const btn=$("#aiBtn");btn.disabled=true;const hist=S.chat.slice(0,-1).slice(-12);
  const turns=hist.map((m,k)=>({role:m.role,content:k===0?tutorBrief()+"\n\nStudent: "+m.content:m.content}));
  if(turns[0].role!=="user")turns.shift();
  const bubbles=()=>document.querySelectorAll("#chat .msg.ai");
  try{const sample=await getSample();if(!sample)throw{code:"unavailable"};
   const r=await sample(turns,{cache:false,onText:({text})=>{S.chat[S.chat.length-1].content=text;const b=bubbles();if(b.length)b[b.length-1].textContent=text}});
   S.chat[S.chat.length-1].content=r.text}
  catch(e){S.chat[S.chat.length-1].content=e&&e.code==="rate_limited"?L("طلبات كثيرة، انتظر قليلاً ثم أعد المحاولة.","Too many requests. Wait a moment and try again."):L("المساعد غير متاح في هذه المعاينة. في التطبيق النهائي يعمل عبر خادمك.","The tutor isn't available in this preview. In the real app it runs through your server.");if(e&&e.text)S.chat[S.chat.length-1].content=e.text}
  S.chat=S.chat.slice(-30);save();render()},
 async genEx(d,el){const out=$("#ex");out.hidden=false;out.textContent=L("...جارٍ التحضير","Preparing...");el.disabled=true;
  const b=branch(),c=CH[d.sub][+d.i];
  const p=`${tutorBrief()}\n\nWrite 3 original BAC-style exercises of increasing difficulty on the lesson "${c[1]} (${c[0]})" in ${SUB[d.sub][1]} for the ${b.n[1]} branch. Give one short hint per exercise, then full worked solutions at the end under a clear heading. Language: ${S.lang==="ar"?"Arabic":"English"}. Plain text, no LaTeX.`;
  try{const sample=await getSample();if(!sample)throw{code:"unavailable"};
   const r=await sample(p,{cache:false,onText:({text})=>{out.textContent=text}});out.textContent=r.text}
  catch(e){out.textContent=e&&e.text?e.text:L("المساعد غير متاح في هذه المعاينة.","The tutor isn't available in this preview.")}
  el.disabled=false},
 tSubmit(){const g=id=>$(id).value.trim();const n=g("#tn"),e=g("#te"),f=$("#tf").files[0];
  if(!n||!e||!g("#tsc"))return toast(L("أكمل الاسم والبريد والمؤسسة.","Fill in name, email and school."));
  if(!f)return toast(L("أرفق وثيقة تثبت أنك أستاذ.","Attach a document proving you teach."));
  if(!$("#tok").checked)return toast(L("أكّد صحة المعلومات.","Confirm the information is accurate."));
  S.teacher={name:n,email:e,phone:g("#tp"),sub:$("#ts").value,wilaya:$("#tw").value,school:g("#tsc"),doc:f.name,status:"pending"};save();stack=[];go("tPending",{},false)},
 tApprove(){S.teacher.status="verified";save();toast(L("تم توثيق حسابك","You're verified"));tab("tHome")},
 tPublish(){const u=$("#au").value.trim(),t=$("#at").value.trim();
  if(!t||!/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(u))return toast(L("أدخل عنواناً ورابط يوتيوب صحيحاً.","Enter a title and a valid YouTube link."));
  S.lessons.push({sub:$("#as").value,i:+$("#ac").value,title:t,url:u,teacher:S.teacher.name,email:S.teacher.email});save();toast(L("نُشر الدرس للتلاميذ","Published to students"));tab("tHome")},
 tReply(d){const q=S.questions.find(x=>x.id==d.id),r=$("#r"+d.id).value.trim();if(!r)return;q.reply=r;q.teacher=S.teacher.name;save();toast(L("أُرسل ردّك","Reply sent"));render()},
 tBuy(){S.tplus=true;save();toast(L("تم تفعيل Plus","Plus activated"));render()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener("input",e=>{const el=e.target;
 if(el.dataset.c==="note"){S.notes[el.dataset.k]=el.value;save()}
 if(el.dataset.c==="mark"){let v=el.value.replace(",",".");S.marks[el.dataset.sub]=v;save();
  const b=branch();let t=0,w=0;for(const s in b.s){const m=parseFloat(S.marks[s]);if(!isNaN(m)&&m>=0&&m<=20){t+=m*b.s[s];w+=b.s[s]}}
  const a=w?t/w:0;$("#avg").textContent=w?a.toFixed(2):"—";$("#avgm").textContent=w?(a>=10?L("ناجح","Pass"):L("دون المعدل","Below pass")):L("أدخل علاماتك المتوقعة","Enter your expected marks")}});
document.addEventListener("change",e=>{if(e.target.dataset.c==="tSub"){V.sub=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.target.id==="aiq"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();A.aiSend()}});
render();
</script>
</body>
</html>
